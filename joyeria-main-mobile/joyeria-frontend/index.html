<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AURA — Joyería fina artesanal colombiana. Anillos, collares, pulseras y más en oro, plata y piedras preciosas." />
    <meta property="og:title" content="AURA | Joyería Fina Artesanal" />
    <meta property="og:description" content="Fine Artisan Jewelry. Piezas hechas para celebrar la vida." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" id="theme-color" content="#FFFFFF" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('aura-theme')
          var dark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <title>AURA | Joyería Fina Artesanal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
