server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: joyeria-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/joyeria}
    username: ${DATABASE_USERNAME:joyeria_user}
    password: ${DATABASE_PASSWORD:joyeria_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Bogota
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:YXJjaXZhbG9uZ2xhY2xhdmVkb3JhZGFRdWVzZWNyZXRhVmVyZERhZG9od0ZvcnRpZmF6aW9uMjAyNg==}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:uploads}

payment:
  provider: ${PAYMENT_PROVIDER:sandbox}
  mercado-pago:
    public-key: ${MERCADOPAGO_PUBLIC_KEY:}
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

email:
  from: ${EMAIL_FROM:no-reply@aurajoyeria.com}
  api-key: ${EMAIL_API_KEY:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  level:
    org.springframework.security: INFO
    com.joyeria: DEBUG