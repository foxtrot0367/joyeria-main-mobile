server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: joyeria-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/joyeria}
    username: ${DATABASE_USERNAME:joyeria_user}
    password: ${DATABASE_PASSWORD:joyeria_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Bogota
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mail:
    # Configura MAIL_HOST/USERNAME/PASSWORD y pon EMAIL_ENABLED=true para enviar correos reales.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${REFRESH_JWT_EXPIRATION:604800000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:uploads}
  email:
    # EMAIL_ENABLED=true activa el envío por SMTP (requiere MAIL_HOST).
    # EMAIL_LOG_LINK=true registra los enlaces en logs (solo para desarrollo).
    enabled: ${EMAIL_ENABLED:false}
    log-link: ${EMAIL_LOG_LINK:false}
  security:
    trusted-proxies: ${TRUSTED_PROXIES:}

payment:
  provider: ${PAYMENT_PROVIDER:sandbox}
  mercado-pago:
    public-key: ${MERCADOPAGO_PUBLIC_KEY:}
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

email:
  from: ${EMAIL_FROM:no-reply@aurajoyeria.com}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  level:
    org.springframework.security: INFO
    com.joyeria: DEBUG
