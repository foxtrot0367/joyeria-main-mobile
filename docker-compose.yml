version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-joyeria}
      POSTGRES_USER: ${DATABASE_USERNAME:-joyeria_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-joyeria_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-joyeria_user} -d ${DATABASE_NAME:-joyeria}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./joyeria-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-joyeria}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-joyeria_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-joyeria_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build: ./joyeria-frontend
    environment:
      VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
